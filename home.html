<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Geo-Intelligence | Home</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <h1>Health Geo-Intelligence</h1>
                <p>AP Health Locator Service</p>
            </div>
            <nav class="header-nav">
                <button onclick="location.href='about.html'" class="nav-btn">About</button>
                <button onclick="location.href='home.html'" class="nav-btn active">Home</button>
                <button onclick="location.href='dashboard.html'" class="nav-btn">Dashboard</button>
            </nav>
        </div>
    </header>

    <main>
        <div id="home-page" class="view-section active">
            <div class="home-sidebar">
                <div class="sidebar-header">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                        <div>
                            <h3>Health Locator</h3>
                            <p>Find resources near you</p>
                        </div>
                        <button id="toggle-home-sidebar" class="home-hamburger">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
                <button id="trigger-nearby" class="sidebar-trigger-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <span>Nearby Facilities</span>
                </button>
            </div>
            <div id="map" style="flex: 1; height: 100%;"></div>
        </div>
    </main>

    <script src="home.js"></script>
</body>
</html>
