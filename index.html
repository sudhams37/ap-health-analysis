<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Geo-Intelligence | Home</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <h1>Health Geo-Intelligence</h1>
                <p>AP Health Locator Service</p>
            </div>
            <nav class="header-nav">
                <button onclick="location.href='about.html'" class="nav-btn">About</button>
                <button onclick="location.href='index.html'" class="nav-btn active">Home</button>
                <button onclick="location.href='dashboard.html'" class="nav-btn">Dashboard</button>
            </nav>
        </div>
    </header>

    <main>
        <div id="home-page">
            <div class="home-sidebar">
                <div class="sidebar-header">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                        <div>
                            <h3>Health Locator</h3>
                            <p>Resource Discovery</p>
                        </div>
                        <button id="toggle-home-sidebar" class="home-hamburger">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="3" y1="12" x2="21" y2="12"></line>
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <line x1="3" y1="18" x2="21" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="locator-controls" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <div class="sidebar-search-group" style="margin-bottom: 0.25rem;">
                        <div style="position: relative;">
                            <input type="text" id="global-hospital-search" placeholder="Search for hospitals..." 
                                style="width: 100%; padding: 0.6rem 1rem 0.6rem 2.5rem; background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; color: #000000; font-size: 0.75rem; font-weight: 600;">
                            <svg style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: #000000;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </div>
                    </div>

                    <button id="trigger-interest" class="sidebar-trigger-btn"
                        style="background: #1e293b; justify-content: space-between; padding: 0.35rem 1.25rem; margin-bottom: 0.25rem;">
                        <span
                            style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">Interested
                            Area</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    </button>

                    <button id="toggle-facilities" class="sidebar-trigger-btn"
                        style="background: #1e293b; justify-content: space-between; padding: 0.35rem 1.25rem;">
                        <span
                            style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">Nearby
                            Facilities</span>
                        <span id="toggle-icon" style="font-size: 1.2rem; font-weight: bold;">+</span>
                    </button>

                    <div id="facilities-menu"
                        style="display: none; flex-direction: column; gap: 0.5rem; transition: all 0.3s ease; margin-top: 0.25rem;">
                        <button id="trigger-nearby" class="sidebar-trigger-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <span>Nearby Hospitals</span>
                        </button>

                        <button id="trigger-blood" class="sidebar-trigger-btn" style="background: #be123c;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z">
                                </path>
                            </svg>
                            <span>Nearby Blood Banks</span>
                        </button>

                        <button id="trigger-pharmacy" class="sidebar-trigger-btn" style="background: #059669;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z">
                                </path>
                            </svg>
                            <span>Nearby Pharmacies</span>
                        </button>

                        <button id="trigger-healthcare" class="sidebar-trigger-btn" style="background: #d97706;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"></path>
                            </svg>
                            <span>Nearby Health Care Centers</span>
                        </button>
                    </div>

                    <button id="toggle-analysis" class="sidebar-trigger-btn"
                        style="background: #1e293b; justify-content: space-between; padding: 0.35rem 1.25rem; margin-top: 0.5rem;">
                        <span
                            style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">Graph
                            Analysis</span>
                        <span id="analysis-toggle-icon" style="font-size: 1.2rem; font-weight: bold;">+</span>
                    </button>

                    <div id="analysis-menu"
                        style="display: none; flex-direction: column; gap: 0.5rem; transition: all 0.3s ease; margin-top: 0.25rem; background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 12px;">
                        <button id="trigger-population" class="sidebar-trigger-btn" style="background: #6366f1;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            <span>Population Analysis</span>
                        </button>
                        <button id="trigger-beds-analysis" class="sidebar-trigger-btn"
                            style="background: #7c3aed; margin-top: 0.5rem;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M2 4v16M2 11h20M22 4v16M2 8h20M2 15h20"></path>
                            </svg>
                            <span>Beds Requirement</span>
                        </button>
                        <button id="trigger-gap-analysis" class="sidebar-trigger-btn"
                            style="background: #db2777; margin-top: 0.5rem;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                                </path>
                                <line x1="12" y1="9" x2="12" y2="13"></line>
                                <line x1="12" y1="17" x2="12.01" y2="17"></line>
                            </svg>
                            <span>Infrastructure Gap Analysis</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Floating Locator Modal (The Floating Div) -->
            <div id="locator-modal" class="modal-overlay hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modal-title">Localized Health Search</h3>
                        <button id="close-modal" class="close-btn">&times;</button>
                    </div>
                    <div class="locator-form">
                        <div class="input-group">
                            <label>District</label>
                            <input type="text" id="loc-district" placeholder="e.g. Kurnool">
                        </div>
                        <div class="input-group">
                            <label>Mandal</label>
                            <input type="text" id="loc-mandal" placeholder="e.g. Panyam">
                        </div>
                        <div class="input-group">
                            <label>Village</label>
                            <input type="text" id="loc-village" placeholder="Enter Village Name">
                        </div>
                        <div class="input-group">
                            <label>Distance (KM Radius)</label>
                            <input type="number" id="loc-distance" value="25" min="1" max="100">
                        </div>
                        <div class="input-group" id="loc-type-container" style="display: none;">
                            <label id="loc-type-label">Facility Type</label>
                            <select id="loc-type" class="select-input"
                                style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; background: white;">
                                <!-- Options injected by JS -->
                            </select>
                        </div>
                        <button id="search-facilities" class="sidebar-trigger-btn search-btn"
                            style="margin-top:1.5rem;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <span id="search-btn-text">Search Hospitals</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Interested Area Modal (State Search) -->
            <div id="interest-modal" class="modal-overlay hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Interested Area Audit</h3>
                        <button id="close-interest-modal" class="close-btn">&times;</button>
                    </div>
                    <div class="locator-form">
                        <div class="input-group">
                            <label>Enter State</label>
                            <input type="text" id="interest-state" placeholder="e.g. Andhra Pradesh">
                        </div>
                        <div class="input-group" style="margin-top: 0.5rem;">
                            <label>Facility Type</label>
                            <select id="interest-type" class="select-input"
                                style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; background: white;">
                                <option value="all">All Facilities</option>
                                <option value="hospital">Hospitals</option>
                                <option value="blood">Blood Banks</option>
                                <option value="pharmacy">Pharmacies</option>
                                <option value="healthcare">Health Care Centers</option>
                            </select>
                        </div>
                        <button id="search-interest-state" class="sidebar-trigger-btn search-btn" style="margin-top:1.5rem; background: #0f172a;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <span>Search State Data</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="map-and-table-wrapper">
                <div id="map"></div>
                <div class="table-container">
                    <div class="table-header">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <button id="toggle-table-view" class="table-hamburger">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <line x1="3" y1="12" x2="21" y2="12"></line>
                                    <line x1="3" y1="6" x2="21" y2="6"></line>
                                    <line x1="3" y1="18" x2="21" y2="18"></line>
                                </svg>
                            </button>
                            <h4 id="table-title">Hospital Registry for Selected Area</h4>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <span id="results-count">Showing 0 hospitals</span>
                            <button id="download-report-btn"
                                style="display:flex; align-items:center; justify-content:center; gap: 6px; padding: 0.4rem 0.8rem; font-size: 0.85rem; font-family: 'Inter', sans-serif; font-weight: 500; background-color: #0ea5e9; color: white; border: none; border-radius: 4px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                Download Report
                            </button>
                        </div>
                    </div>
                    <div class="table-scroll-wrapper">
                        <table id="results-table">
                            <thead>
                                <tr>
                                    <th id="th-name">Hospital Name</th>
                                    <th>Category</th>
                                    <th>Distance</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <!-- Table rows will be injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="home.js"></script>
</body>

</html>
